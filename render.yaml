# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Status: NOT YET DEPLOYED. Items marked ASSUMED must be confirmed on the first deploy
# (see docs/DEVELOPMENT.md -> "Deploying to Render").
#
# DEVELOPMENT/STAGING ONLY. Plans are pinned to `free` explicitly: when `plan` is omitted
# Render defaults to PAID instance types. The free Postgres database expires 30 days after
# creation and has no backups - it is not a production database.
# preDeployCommand is paid-only, so migrations run in scripts/start.sh at startup
# (single instance only - revisit before scaling out; see docs/DECISIONS.md ADR-013).

databases:
  - name: callcopilot-db
    plan: free
    databaseName: callcopilot
    postgresMajorVersion: "16"

services:
  - type: web
    name: callcopilot-api
    plan: free
    runtime: python
    rootDir: backend
    # Render uses uv when uv.lock is present in the service root (VERIFIED in Render docs).
    buildCommand: uv sync --frozen --no-dev
    # Runs `alembic upgrade head`, then uvicorn; exits (fails the deploy) if migration fails.
    startCommand: bash scripts/start.sh
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: APP_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: callcopilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: strict
      # The frontend origin, e.g. https://callcopilot-web.onrender.com (required for the
      # CSRF origin check on /auth/refresh and /auth/logout).
      - key: CORS_ORIGINS
        sync: false
      # Client IP for rate limiting. 0 = ignore X-Forwarded-For (fail-safe: all clients share
      # the proxy's bucket). Set only after measuring Render's proxy chain (docs/SECURITY.md).
      - key: TRUSTED_PROXY_HOPS
        value: "0"
      # Temporary: enables GET /health/client-ip to measure the proxy chain. Disable after.
      - key: DIAGNOSTICS_ENABLED
        value: "true"

  - type: web
    name: callcopilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Empty = same-origin /api calls through the rewrite below (keeps cookies first-party).
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      # Proxy API calls to the API service. Rewrites to a full external URL are supported
      # (VERIFIED in Render docs); replace the host with the API service's actual URL.
      - type: rewrite
        source: /api/*
        destination: https://callcopilot-api.onrender.com/api/*
      # SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html
